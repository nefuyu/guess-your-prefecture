<style>
  :root {
    --bg: #0f1220;
    --fg: #f4f5fa;
    --muted: #9aa0b8;
    --accent: #ff4d6d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
  }
  main { width: 100%; max-width: 640px; }
  .lead { color: var(--muted); font-size: 0.95rem; margin: 0 0 32px; }
  .lead strong { color: var(--fg); }
  .q { font-size: clamp(1.2rem, 4.5vw, 1.6rem); line-height: 1.6; margin: 0; }
  .pref {
    display: block;
    font-size: clamp(3rem, 16vw, 6rem);
    font-weight: 800;
    color: var(--accent);
    margin: 8px 0;
    letter-spacing: 0.05em;
  }
  .share { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 40px; }
  .share a {
    padding: 12px 24px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--fg);
    text-decoration: none;
    font-size: 0.95rem;
  }
  footer { margin-top: 48px; font-size: 0.75rem; color: var(--muted); }

<body>

    <a data-text="住んでいる都道府県を約10%の確率で当てられるらしい…！" target="_blank" rel="noopener">Xでシェアする</a>
  </div>
  <footer>※ 東京都の人口は日本の総人口の約11%です。</footer>
</main>
<script>
  const url = "https://nefuyu.github.io/guess-your-prefecture/";
  document.querySelectorAll(".share a").forEach((a) => {
    a.href = "https://x.com/intent/post?" + new URLSearchParams({ text: a.dataset.text, url });
  });
</script>
</body>
